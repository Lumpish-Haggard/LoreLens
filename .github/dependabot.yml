# LoreLens has no runtime dependencies, so this only keeps the CI actions
# themselves current. That still matters — stale actions break builds.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
    labels:
      - "chore"
    # One pull request for all of them, rather than one each. The first run
    # opened four at once, which is a lot of ceremony for four version numbers
    # in two workflow files — and they are far easier to judge together, since
    # CI either passes with the whole set or it does not.
    groups:
      github-actions:
        patterns:
          - "*"
